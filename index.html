<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Thu Chi</title>
<meta name="theme-color" content="#f3f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121119" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one phone-width column like a notebook page. Money lives on "vở ô ly" ruled panels.
   Surfaces are flat hairline sheets; elevation is reserved for the amount panel and the primary action.
   Accent = desaturated school ink (mực tím); red/green are semantic only. */
:root{
  --bg:#f3f2f7; --surface:#ffffff; --sunk:#ebe9f2; --ink:#1b1930; --muted:#686579; --line:#e2dfeb;
  --accent:#4b3ca6; --accent-ink:#ffffff; --accent-soft:#ebe8f7; --grid:rgba(75,60,166,.075);
  --exp:#c7394f; --exp-soft:#fbe8eb; --inc:#0f7f64; --inc-soft:#e1f3ed; --warn:#a8701a;
  --lift:0 1px 1px rgba(40,30,110,.04),0 10px 26px -14px rgba(40,30,110,.28);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121119; --surface:#1b1a25; --sunk:#25232f; --ink:#ecebf3; --muted:#9a97ab; --line:#2b2939;
  --accent:#b1a5f2; --accent-ink:#17142a; --accent-soft:#272341; --grid:rgba(177,165,242,.065);
  --exp:#ff8597; --exp-soft:#3a1f28; --inc:#4fd0ab; --inc-soft:#15302a; --warn:#e5b25c;
  --lift:0 1px 0 rgba(255,255,255,.04) inset,0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121119; --surface:#1b1a25; --sunk:#25232f; --ink:#ecebf3; --muted:#9a97ab; --line:#2b2939;
  --accent:#b1a5f2; --accent-ink:#17142a; --accent-soft:#272341; --grid:rgba(177,165,242,.065);
  --exp:#ff8597; --exp-soft:#3a1f28; --inc:#4fd0ab; --inc-soft:#15302a; --warn:#e5b25c;
  --lift:0 1px 0 rgba(255,255,255,.04) inset,0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,label,.cats-scroll{touch-action:manipulation}
.keypad,.cats,.e-head,.tabbar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:transform .16s var(--ease),background-color .2s,color .2s,box-shadow .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
h1{font-family:var(--f-display);font-size:30px;font-weight:700;margin:0;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
h2{font-size:15px;font-weight:600;color:var(--ink);margin:0;letter-spacing:-.005em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:44px;margin:4px 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.exp{color:var(--exp)} .inc{color:var(--inc)}
.lead{font-size:13px;color:var(--muted);margin:4px 0 0;max-width:62ch}

/* entering a tab: rows rise in, staggered */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter .stack>*{animation:rise .38s var(--ease) both}
.enter .stack>*:nth-child(2){animation-delay:.04s}.enter .stack>*:nth-child(3){animation-delay:.08s}
.enter .stack>*:nth-child(4){animation-delay:.12s}.enter .stack>*:nth-child(n+5){animation-delay:.16s}

/* sample banner: one slim strip */
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r);padding:8px 8px 8px 12px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.banner b{color:var(--accent);font-weight:600}
.banner span{flex:1;min-width:180px}
.banner button{background:var(--accent);color:var(--accent-ink);padding:6px 11px;border-radius:8px;font-weight:600;font-size:12.5px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,15,60,.08)}
.seg.type button[data-v="e"][aria-pressed="true"]{color:var(--exp)}
.seg.type button[data-v="i"][aria-pressed="true"]{color:var(--inc)}
.seg.sm button{padding:5px 11px;font-size:13px}

/* date row */
.daterow{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);flex:none;font-size:20px;line-height:1;color:var(--ink)}
.datepick{flex:1;min-width:0;position:relative;height:40px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14.5px}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.field{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;transition:border-color .2s}
.field:focus{border-color:var(--accent);outline:none}
.field::placeholder{color:var(--muted)}

/* ruled money panel (vở ô ly) */
.ruled{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px;background-position:-1px -1px}
.amount{position:relative;border-radius:var(--r-lg);padding:12px 18px 12px 22px;box-shadow:var(--lift);display:flex;flex-direction:column;align-items:flex-end;min-height:88px;justify-content:center;overflow:hidden}
.amount::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--exp);opacity:.55}
.amount.i::before{background:var(--inc)}
.amount .expr{font-size:13px;color:var(--muted);min-height:18px;word-break:break-all;text-align:right}
.amount .val{font-family:var(--f-display);font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.1;word-break:break-all;text-align:right}

/* categories: no boxes, the icon carries the selection */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 6px}
.cat{border-radius:var(--r);padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cat .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:21px;transition:box-shadow .2s,transform .2s var(--ease)}
.cat .nm{font-size:12px;font-weight:500;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--accent-soft)}
.cat[aria-pressed="true"] .ic{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);transform:scale(1.04)}
.cat[aria-pressed="true"] .nm{color:var(--ink);font-weight:600}

/* keypad */
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.key.op{background:var(--sunk);border-color:transparent;color:var(--accent);font-weight:600}
.key:active,.key.down{transform:scale(.94);background:var(--accent-soft)}
.key{transition:transform .08s,background-color .12s}
.submit{height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;width:100%;box-shadow:var(--lift);letter-spacing:.005em}
.submit:disabled{opacity:.4;cursor:default;box-shadow:none}
.editbar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:8px 10px 8px 14px;font-size:13.5px}
.btn{padding:8px 12px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--sunk)}
.btn.danger{color:var(--exp)}
.btn.armed{background:var(--exp);color:#fff}
.btn.primary{background:var(--accent);color:var(--accent-ink)}

/* ledger summary: one figure leads, income/spend support it */
.ledger{border-radius:var(--r-lg);border:1px solid var(--line);padding:16px 18px}
.lg-main{display:flex;flex-direction:column;gap:2px}
.lb{font-size:12.5px;color:var(--muted)}
.lg-big{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
.lg-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lg-split>div{display:flex;flex-direction:column;gap:1px;min-width:0;padding-left:10px;border-left:2px solid var(--inc)}
.lg-split>div.e{border-left-color:var(--exp)}
.lg-split b{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em;overflow-wrap:anywhere}
.bal{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-size:13.5px}
.bal + .bal{border-top:0;margin-top:0;padding-top:4px}

/* calendar */
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav .lbl{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.015em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:11px;font-weight:600;text-align:center;color:var(--muted);padding:2px 0 6px;letter-spacing:.06em}
.cal .wd.sun{color:var(--exp)}
.day{min-height:60px;border-radius:11px;padding:5px 3px;display:flex;flex-direction:column;align-items:stretch;gap:1px;text-align:right;min-width:0;overflow:hidden}
.day.has{background:var(--sunk)}
.day .d{font-size:13px;font-weight:600;text-align:left;padding-left:3px}
.day.sun .d{color:var(--exp)}
.day .m{font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.day.out{visibility:hidden}
.day.today .d{color:var(--accent-ink);background:var(--accent);border-radius:7px;align-self:flex-start;padding:0 5px;margin-left:1px}
.day[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.daylist{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:active{transform:scale(.99)}
.row .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx .a{font-weight:600;font-size:14.5px}
.row .tx .b{font-size:12.5px;color:var(--muted)}
.daylist .tx .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.dayhead b{font-size:15.5px;font-weight:600}
.add{margin-top:10px;width:100%;padding:11px;border-radius:var(--r);border:1.5px dashed var(--line);color:var(--accent);font-weight:600}

/* report */
.donutwrap{display:grid;place-items:center;padding:8px 0 10px}
.donut{width:min(230px,64vw);height:auto;display:block}
.donut text{fill:var(--ink)}
.donut .t1{font-size:11px;fill:var(--muted)}
.donut .t2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.5px}
.legend .row{padding:10px 0;align-items:flex-start}
.legend .row .dot{margin-top:6px}
.legend .row .pct,.legend .row .amt{line-height:1.45}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.pct{font-size:12.5px;color:var(--muted);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--inc);transition:width .5s var(--ease)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--exp)}
.budgettop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.big{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.025em}
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .lb{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .bi{fill:var(--inc)} .chart .be{fill:var(--exp)}
.keyline{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.keyline span{display:inline-flex;align-items:center;gap:5px}
.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:14px}

/* settings */
.set .row{cursor:default}
.money{width:128px;height:36px;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;background:transparent;padding:0 2px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;transition:border-color .2s}
.money::placeholder{color:var(--muted);font-weight:400}
.money:focus{border-bottom:1.5px solid var(--accent);outline:none}
.catedit{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.catedit:first-child{border-top:0}
.catedit .em{width:44px;height:38px;border-radius:12px;border:0;background:var(--sunk);text-align:center;font-size:17px;flex:none}
.catedit .nm{flex:1;min-width:0;height:38px;border-radius:12px;border:1px solid transparent;background:var(--sunk);padding:0 12px;transition:border-color .2s}
.catedit .nm:focus,.catedit .em:focus{border:1px solid var(--accent);outline:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;margin-top:6px;border-top:1px solid var(--line);font-size:13.5px}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--sunk);padding:5px 10px;border-radius:8px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.chip.ok i{background:var(--inc)}
textarea.csv{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink)}
.ver{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 0}

.obud{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.obud .a{font-weight:600}
.other-row{border-top:0!important;background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin:4px -8px 0;padding-left:8px;padding-right:8px;border-radius:12px}
/* recurring */
.repeat{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:13px;background:var(--accent-soft);border-radius:var(--r);padding:9px 12px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;vertical-align:2px;letter-spacing:.02em}
.day .m.plan{opacity:.5;font-style:italic}
.plan-row{opacity:.7}

/* tabbar: frosted, active tab gets an ink pill */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tabbar button svg{width:22px;height:22px;padding:4px 16px;box-sizing:content-box;border-radius:999px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background-color .25s var(--ease)}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabbar button[aria-current="page"] svg{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:9;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--lift);animation:rise .25s var(--ease)}

/* entry: one fixed screen. Header and note on top, categories scroll in the middle,
   amount + keypad pinned above the tab bar so nothing needs page scrolling. */
body.locked{overflow:hidden;overscroll-behavior:none}
.entry{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:var(--dockb,calc(66px + env(safe-area-inset-bottom,0px)));max-width:540px;margin:0 auto;padding:10px 16px 10px;display:flex;flex-direction:column;gap:8px}
.entry>.banner{margin:0}
.e-head{display:flex;gap:8px;align-items:center;flex:none}
.e-head .seg{flex:none;width:118px}
.e-head .seg button{padding:8px 6px}
.e-date{flex:1;min-width:0;display:flex;align-items:center;background:var(--sunk);border-radius:12px;height:40px}
.e-date .nav{width:36px;height:40px;font-size:21px;line-height:1;color:var(--muted);flex:none;border-radius:12px}
.e-date .datepick{background:none;height:40px;font-size:14px;white-space:nowrap;overflow:hidden}
.e-note{display:flex;gap:8px;flex:none}
.e-note .field{flex:1;min-width:0;height:40px}
input,select,textarea{font-size:16px}
input.money{font-size:16px}
.repchip{flex:none;max-width:52%;height:40px;padding:0 12px;border-radius:12px;background:var(--sunk);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repchip.on{background:var(--accent-soft);color:var(--accent)}
.cats-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -8px;padding:2px 8px 10px;-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);mask-image:linear-gradient(#000 calc(100% - 16px),transparent)}
.dock{flex:none;display:flex;flex-direction:column;gap:8px}
.dock .amount{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;min-height:66px;padding:8px 16px 8px 24px}
.amt-r{display:flex;flex-direction:column;align-items:flex-end;min-width:0;flex:1}
.dock .amount .val{font-size:clamp(26px,8vw,34px)}
.dock .amount .expr{min-height:0;font-size:12.5px}
.pick{display:flex;align-items:center;gap:8px;min-width:0;max-width:45%;font-size:13.5px;color:var(--muted);font-weight:500}
.pick .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.pick .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{color:var(--ink);font-weight:600}
.pick.need{color:var(--accent);font-weight:600;animation:nudge .9s var(--ease) 2}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.dock .keypad{gap:6px}
.dock .key{height:clamp(40px,6.3dvh,52px);font-size:20px}
.key.go{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:16px;font-weight:700;box-shadow:var(--lift)}
.key.go:disabled{opacity:.38;box-shadow:none;cursor:default}
.key.go:active:not(:disabled){background:var(--accent);transform:scale(.94)}
.enter .entry>*{animation:rise .38s var(--ease) both}
.enter .entry>.dock{animation-delay:.08s}
body.locked .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-height:640px){ .dock .amount{min-height:56px} .entry{gap:6px;padding-top:6px} }
@media (hover:hover){
  .key:hover,.iconbtn:hover,.btn:hover{background:var(--accent-soft)}
  .btn.primary:hover,.submit:hover:not(:disabled),.banner button:hover{filter:brightness(1.08)}
  .cat:hover:not([aria-pressed="true"]),.tabbar button:hover{color:var(--ink)}
  .cat:hover .ic{transform:translateY(-1px)}
  button.row:hover{background:linear-gradient(90deg,transparent,var(--accent-soft) 30%,var(--accent-soft) 70%,transparent)}
  .add:hover{border-color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
@media (min-width:420px){.cats{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app" id="app"><div id="view"></div></div>
<div class="tabbar"><nav id="tabs">
  <button data-tab="entry" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Nhập</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Lịch</button>
  <button data-tab="rep"><svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z"/><path d="M15 3.8A8.5 8.5 0 0 1 20.2 9H15z"/></svg>Báo cáo</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Cài đặt</button>
</nav></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = new Intl.NumberFormat("vi-VN");
const fmt = n => NF.format(Math.round(n)) + " đ";
const short = n => { n = Math.round(n); const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(1).replace(".0","").replace(".",",") + "tỷ";
  if (a >= 1e6) return (n/1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".0","").replace(".",",") + "tr";
  if (a >= 1e3) return Math.round(n/1e3) + "k"; return String(n); };
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const ymOf = s => s.slice(0,7);
const addMonths = (ym, k) => { let [y,m] = ym.split("-").map(Number); m += k; while (m > 12){m-=12;y++} while (m < 1){m+=12;y--} return y+"-"+pad(m); };
const WD = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
const dmy = s => { const d = parseD(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); };
const longDate = s => WD[parseD(s).getDay()] + ", " + dmy(s);
const ymLabel = ym => { const [y,m] = ym.split("-"); return "Tháng " + Number(m) + "/" + y; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const COLORS = ["#e0604f","#e8a33d","#4fa65a","#3f8fd0","#8a63d2","#d05a9a","#36aaa8","#a0784f","#7d8a99","#c4ad2c","#5d6fd6","#cf7a3a"];
const TODAY = ymd(new Date());

function defaultSettings(){
  return {
    exp:[["e1","🍜","Ăn uống"],["e2","🛒","Đi chợ"],["e3","⛽","Đi lại"],["e4","🏠","Nhà cửa"],["e5","💡","Điện nước"],["e6","🛍️","Mua sắm"],["e7","💊","Sức khỏe"],["e8","📚","Học hành"],["e9","🎬","Giải trí"],["e10","🎁","Hiếu hỉ"],["e11","📦","Khác"]]
      .map(([id,ic,name],k)=>({id,ic,name,col:k})),
    inc:[["i1","💼","Lương"],["i2","🏆","Thưởng"],["i3","💻","Làm thêm"],["i4","🏦","Lãi tiết kiệm"],["i5","🧧","Được cho"],["i6","📦","Khác"]]
      .map(([id,ic,name],k)=>({id,ic,name,col:(k+2)%COLORS.length})),
    budgets:{}, opening:0, onlyBudgeted:false, recur:[]
  };
}

/* ---------- sample data (shown until the first real entry) ---------- */
function makeSample(){
  let seed = 20261011; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const amt = (lo,hi) => Math.round((lo + rnd()*(hi-lo))/1000)*1000;
  const st = defaultSettings();
  st.budgets = {e1:3500000,e2:2500000,e3:800000,e6:1500000,e9:600000}; st.opening = 5000000;
  st.recur = [
    {id:"s1", t:"e", c:"e4", a:4500000, n:"Tiền nhà", f:"m", day:1, wd:0, last:TODAY},
    {id:"s2", t:"i", c:"i1", a:15000000, n:"Lương tháng", f:"m", day:5, wd:0, last:TODAY},
    {id:"s3", t:"e", c:"e8", a:350000, n:"Học tiếng Anh", f:"w", day:1, wd:6, last:TODAY}];
  const months = {}; const curYm = ymOf(TODAY);
  const push = (date,t,c,a,n) => { (months[ymOf(date)] ||= []).push({id:uid(),t,c,a,d:date,n:n||""}); };
  for (let k=-2;k<=0;k++){
    const ym = addMonths(curYm,k); const [y,m] = ym.split("-").map(Number);
    const last = k===0 ? Number(TODAY.slice(8)) : new Date(y,m,0).getDate();
    for (let d=1; d<=last; d++){
      const ds = ym+"-"+pad(d);
      if (d===1) push(ds,"e","e4",4500000,"Tiền nhà");
      if (d===5){ push(ds,"i","i1",15000000,"Lương tháng"); push(ds,"e","e5",amt(550000,780000),"Điện, nước, mạng"); }
      push(ds,"e","e1",amt(30000,65000), rnd()<.5?"Phở sáng":"Cơm trưa");
      if (rnd()<.45) push(ds,"e","e1",amt(25000,60000),"Cà phê");
      if (rnd()<.3) push(ds,"e","e2",amt(120000,380000),"Đi chợ");
      if (d%5===2) push(ds,"e","e3",amt(70000,100000),"Đổ xăng");
      if (rnd()<.08) push(ds,"e","e6",amt(150000,650000),"Quần áo");
      if (rnd()<.06) push(ds,"e","e9",amt(90000,250000),"Xem phim");
      if (rnd()<.04) push(ds,"e","e10",500000,"Đám cưới bạn");
      if (rnd()<.05) push(ds,"e","e7",amt(60000,300000),"Thuốc");
      if (rnd()<.06) push(ds,"i","i3",amt(800000,2500000),"Dự án ngoài");
    }
  }
  return {settings:st, months};
}

/* ---------- state & storage ---------- */
const LS_KEY = "sothuchi.v1";
const APP_VERSION = "1.7";
let S, sample = false;
function lsGet(){ try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
(function boot(){
  const c = lsGet();
  if (c && c.settings && c.months){ S = c; } else { S = makeSample(); sample = true; }
})();

let storageWarned = false;
function lsSave(){ if (sample) return; try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ if (!storageWarned){ storageWarned = true; toast("Không lưu được vào máy (bộ nhớ trình duyệt đầy hoặc đang ở chế độ ẩn danh). Hãy xuất CSV để giữ dữ liệu."); } } }
function saveMonth(ym){ const items = S.months[ym] || []; if (!items.length) delete S.months[ym]; lsSave(); }
function saveSettings(){ lsSave(); }

function leaveSample(){
  if (!sample) return false;
  sample = false; S = {settings:defaultSettings(), months:{}}; saveSettings();
  return true;
}

/* keep the notebook when the browser cleans up storage, and work offline */
let persisted = null;
async function initDevice(){
  try { if (navigator.storage && navigator.storage.persist){ persisted = await navigator.storage.persisted() || await navigator.storage.persist(); if (tab==="set") render(); } } catch(e){}
  if ("serviceWorker" in navigator && location.protocol === "https:"){
    try {
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded){ reloaded = true; location.reload(); } });
      const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(()=>{}); });
    } catch(e){}
  }
}
// another tab or window changed the notebook
window.addEventListener("storage", e => { if (e.key !== LS_KEY || !e.newValue) return; try { S = JSON.parse(e.newValue); sample = false; render(true); } catch(_){} });

/* ---------- lookups ---------- */
const catsOf = t => t==="i" ? S.settings.inc : S.settings.exp;
function catById(id){ return S.settings.exp.find(c=>c.id===id) || S.settings.inc.find(c=>c.id===id) || {id, ic:"•", name:"Danh mục đã xóa", col:8}; }
const colorOf = c => (c.hex && /^#[0-9a-f]{6}$/i.test(c.hex)) ? c.hex : COLORS[(c.col ?? 0) % COLORS.length];
const monthItems = ym => S.months[ym] || [];
function totals(items){ let i=0,e=0; for (const x of items){ if (x.t==="i") i+=x.a; else e+=x.a; } return {i,e}; }
/* "Khác" budget: covers the Khác category plus every expense category without a budget of its own */
const OTHER = "__other";
const isOtherCat = c => !!c && c.name.trim().toLowerCase() === "khác";
const otherCat = () => S.settings.exp.find(c => !c.hidden && isOtherCat(c));
function ensureOtherCat(){
  if (otherCat()) return false;
  const L = S.settings.exp, hid = L.find(isOtherCat);
  if (hid) delete hid.hidden; else L.push({id:"c"+uid(), ic:"📦", name:"Khác", col:L.length % COLORS.length});
  return true;
}
function budgetPlan(items){
  const B = S.settings.budgets, oc = otherCat(), other = Number(B[OTHER]) || 0;
  const own = S.settings.exp.filter(c => !(oc && c.id === oc.id) && Number(B[c.id]) > 0);
  const ownIds = new Set(own.map(c => c.id));
  let spent = 0, otherSpent = 0, otherCats = new Set();
  for (const x of items) if (x.t === "e"){ spent += x.a; if (!ownIds.has(x.c)){ otherSpent += x.a; otherCats.add(x.c); } }
  return { totalB: own.reduce((s,c)=>s+Number(B[c.id]),0) + other, spent, other, otherSpent, otherCats: otherCats.size, oc };
}
function migrateOther(){             // an old budget set directly on "Khác" becomes the Khác budget
  const oc = otherCat(), B = S.settings.budgets;
  if (oc && Number(B[oc.id]) > 0 && !(Number(B[OTHER]) > 0)){ B[OTHER] = Number(B[oc.id]); delete B[oc.id]; return true; }
  return false;
}
function balanceThrough(ym){ let b = Number(S.settings.opening)||0; for (const k in S.months){ if (k <= ym){ const t = totals(S.months[k]); b += t.i - t.e; } } return b; }

/* ---------- recurring (thu chi cố định) ---------- */
const WDS = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
const recurs = () => S.settings.recur || (S.settings.recur = []);
function nextOcc(r, after){                       // first occurrence strictly after `after`
  const d = parseD(after);
  if (r.f === "w"){ do { d.setDate(d.getDate()+1); } while (d.getDay() !== r.wd); return ymd(d); }
  let y = d.getFullYear(), m = d.getMonth();
  for (let k=0; k<3; k++){ const last = new Date(y, m+1, 0).getDate(); const c = ymd(new Date(y, m, Math.min(r.day, last))); if (c > after) return c; m++; }
}
const ruleText = r => r.f === "w" ? WDS[r.wd] + " hàng tuần" : "Ngày " + r.day + " hàng tháng";
const occId = (r, d) => "r" + r.id + "-" + d.replace(/-/g,"");
function runRecurring(){
  if (sample) return 0;
  const touched = new Set(); let added = 0, moved = false;
  for (const r of recurs()){
    let n = nextOcc(r, r.last), guard = 0;
    while (n && n <= TODAY && guard++ < 600){
      const ym = ymOf(n), id = occId(r, n), arr = S.months[ym] ||= [];
      if (!arr.some(x => x.id === id)){ arr.push({id, t:r.t, c:r.c, a:r.a, d:n, n:r.n||"", r:r.id}); touched.add(ym); added++; }
      r.last = n; moved = true; n = nextOcc(r, n);
    }
  }
  if (moved){ saveSettings(); touched.forEach(saveMonth); }
  return added;
}
function plannedIn(ym){                           // occurrences after today inside this month
  const out = {}; const end = ym + "-31"; const start = ym + "-01";
  for (const r of recurs()){
    let from = r.last > TODAY ? r.last : TODAY; let n = nextOcc(r, from), guard = 0;
    while (n && n <= end && guard++ < 40){ if (n >= start) (out[n] ||= []).push(r); n = nextOcc(r, n); }
  }
  return out;
}

/* ---------- ui state ---------- */
let tab = "entry";
const ui = { type:"e", date:TODAY, note:"", expr:"", cat:null, editId:null, editYm:null, delArm:false,
  calYm:ymOf(TODAY), calSel:TODAY, repMode:"m", repYm:ymOf(TODAY), repY:Number(TODAY.slice(0,4)), repType:"e",
  setCatType:"e", wipeArm:false, csvText:null, rep:"", recurArm:null };

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 2600); }

function bannerHTML(){
  if (!sample) return "";
  return `<div class="banner"><span><b>Dữ liệu mẫu.</b> Khoản đầu tiên bạn nhập sẽ thay thế toàn bộ.</span><button data-act="clearSample">Bắt đầu sổ trống</button></div>`;
}

/* ---------- ENTRY ---------- */
function evalExpr(s){
  if (!s) return 0; const parts = s.match(/[+\-]?\d+/g) || []; let v = 0; for (const p of parts) v += Number(p); return v;
}
function exprDisplay(s){ return s.replace(/\d+/g, d => NF.format(Number(d))).replace(/-/g," − ").replace(/\+/g," + "); }
function updateAmount(){
  const v = evalExpr(ui.expr); const box = $("#amt"); if (!box) return;
  box.className = "amount ruled " + ui.type;
  box.querySelector(".expr").textContent = /[+\-]/.test(ui.expr) ? exprDisplay(ui.expr) + " =" : "";
  box.querySelector(".val").textContent = fmt(Math.max(0,v));
  box.querySelector(".val").className = "val num " + (ui.type==="i"?"inc":"exp");
  const c = ui.cat && catsOf(ui.type).find(x=>x.id===ui.cat); const pick = $("#pick");
  if (pick){ pick.className = "pick" + (c ? " on" : (v>0 ? " need" : ""));
    pick.innerHTML = c ? `<span class="ic" style="background:${colorOf(c)}26">${esc(c.ic)}</span><span class="nm">${esc(c.name)}</span>` : `<span class="nm">${v>0 ? "Chọn danh mục" : (ui.type==="e"?"Khoản chi":"Khoản thu")}</span>`; }
  const sb = $("#submit"); if (sb) sb.disabled = !(v > 0 && ui.cat);
}
const WD_SHORT = ["CN","T2","T3","T4","T5","T6","T7"];
function shortDate(s){
  const d = parseD(s), t = parseD(TODAY); const diff = Math.round((t - d) / 864e5);
  const dm = pad(d.getDate()) + "/" + pad(d.getMonth()+1) + (d.getFullYear()!==t.getFullYear() ? "/" + d.getFullYear() : "");
  return diff===0 ? "Hôm nay, " + dm : diff===1 ? "Hôm qua, " + dm : WD_SHORT[d.getDay()] + ", " + dm;
}
function repLabel(){
  if (!ui.rep) return "Không lặp";
  const d = parseD(ui.date);
  return ui.rep==="m" ? "↻ Ngày " + d.getDate() + " hằng tháng" : "↻ " + WD_SHORT[d.getDay()] + " hằng tuần";
}
function renderEntry(){
  const cats = catsOf(ui.type).filter(c=>!c.hidden);
  if (!cats.find(c=>c.id===ui.cat)) ui.cat = (ui.editId ? ui.cat : null);
  const edit = ui.editId ? `<div class="editbar"><span>Đang sửa khoản ngày ${dmy(ui.date)}</span><span class="btnrow"><button class="btn danger ${ui.delArm?"armed":""}" data-act="del">${ui.delArm?"Nhấn lần nữa để xóa":"Xóa"}</button><button class="btn" data-act="cancelEdit">Hủy</button></span></div>` : "";
  return `<div class="entry">
    ${bannerHTML()}
    ${edit}
    <div class="e-head">
      <div class="seg type" role="group" aria-label="Loại"><button data-act="type" data-v="e" aria-pressed="${ui.type==="e"}">Chi</button><button data-act="type" data-v="i" aria-pressed="${ui.type==="i"}">Thu</button></div>
      <div class="e-date"><button class="nav" data-act="day" data-v="-1" aria-label="Ngày trước">‹</button>
        <label class="datepick">${esc(shortDate(ui.date))}<input type="date" id="f-date" value="${ui.date}" aria-label="Chọn ngày"></label>
        <button class="nav" data-act="day" data-v="1" aria-label="Ngày sau">›</button></div>
    </div>
    <div class="e-note">
      <input class="field" id="f-note" placeholder="Ghi chú" value="${esc(ui.note)}" autocomplete="off" enterkeyhint="done">
      ${ui.editId ? "" : `<button class="repchip ${ui.rep?"on":""}" data-act="repCycle" aria-label="Lặp lại: ${esc(repLabel())}">${esc(repLabel())}</button>`}
    </div>
    <div class="cats-scroll"><div class="cats">${cats.map(c=>`<button class="cat" data-act="cat" data-v="${c.id}" aria-pressed="${ui.cat===c.id}"><span class="ic" style="background:${colorOf(c)}26">${esc(c.ic)}</span><span class="nm">${esc(c.name)}</span></button>`).join("")}</div></div>
    <div class="dock">
      <div id="amt" class="amount ruled"><span id="pick" class="pick"></span><span class="amt-r"><span class="expr num"></span><span class="val num">0 đ</span></span></div>
      <div class="keypad">
        ${["7","8","9","back","4","5","6","-","1","2","3","+","C","0","000"].map(k=>{
          const lab = k==="back"?"⌫":k==="-"?"−":k; const op = /[^0-9]/.test(k) && k!=="000";
          return `<button class="key ${op?"op":""}" data-act="key" data-v="${k}" aria-label="${k==="back"?"Xóa một số":k==="C"?"Xóa hết":lab}">${lab}</button>`; }).join("")}
        <button class="key go" id="submit" data-act="submit" disabled aria-label="${ui.editId?"Lưu thay đổi":(ui.type==="e"?"Lưu khoản chi":"Lưu khoản thu")}">Lưu</button>
      </div>
    </div>
  </div>`;
}
function pressKey(k){
  let s = ui.expr;
  if (k==="C") s = "";
  else if (k==="back") s = s.slice(0,-1);
  else if (k==="=") s = String(Math.max(0,evalExpr(s)) || "");
  else if (k==="+"||k==="-"){ if (!s) return; s = /[+\-]$/.test(s) ? s.slice(0,-1)+k : s+k; }
  else { const lastNum = (s.match(/\d+$/)||[""])[0]; if (lastNum==="0") s = s.slice(0,-1); if (lastNum.length + k.length > 12) return; if (!lastNum && k==="000") return; s += k; }
  ui.expr = s; updateAmount();
}
function submitEntry(){
  const a = evalExpr(ui.expr); if (!(a>0) || !ui.cat) return;
  const wasSample = leaveSample();
  const ym = ymOf(ui.date);
  if (ui.editId && !wasSample){
    const old = (S.months[ui.editYm]||[]); const idx = old.findIndex(x=>x.id===ui.editId);
    if (idx>=0) old.splice(idx,1);
    if (ui.editYm !== ym) saveMonth(ui.editYm);
  }
  const wasEdit = !!ui.editId;

    recurs().push(rule); saveSettings();

  (S.months[ym] ||= []).push({id: existing || (rule ? occId(rule, ui.date) : uid()), t:ui.type, c:ui.cat, a, d:ui.date, n:ui.note.trim(), ...(rule?{r:rule.id}:{}), ...(ui.editR?{r:ui.editR}:{})});
  saveMonth(ym);
  const caught = rule ? runRecurring() : 0;
  toast((wasSample?"Đã xóa dữ liệu mẫu. ":"") + (wasEdit ? "Đã lưu thay đổi" : (ui.type==="e"?"Đã ghi khoản chi ":"Đã ghi khoản thu ") + fmt(a)) + (rule ? " · lặp " + ruleText(rule).toLowerCase() + (caught ? `, đã ghi bù ${caught} kỳ` : "") : ""));
  ui.expr = ""; ui.note = ""; ui.editId = null; ui.editYm = null; ui.editR = null; ui.delArm = false; ui.rep = "";
  ui.calYm = ym; ui.calSel = ui.date;
  if (wasEdit){ tab = "cal"; }
  render();
}

function donutSVG(parts, total, label){
  const R=80, C=2*Math.PI*R; let off=0; let segs="";
  if (total>0) for (const p of parts){ const len = p.v/total*C; const g = parts.length>1 ? Math.min(2,len/3) : 0;
    segs += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${p.color}" stroke-width="28" stroke-dasharray="${Math.max(0,len-g)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`; off += len; }
  else segs = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line)" stroke-width="28"/>`;
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="${esc(label)}">${segs}<text x="100" y="94" text-anchor="middle" class="t1">${esc(label)}</text><text x="100" y="117" text-anchor="middle" class="t2">${short(total)}</text></svg>`;
}
function breakdown(items, type){
  const map = {}; for (const x of items) if (x.t===type) map[x.c] = (map[x.c]||0) + x.a;
  return Object.entries(map).map(([id,v])=>({c:catById(id), v})).sort((a,b)=>b.v-a.v).map(p=>({...p, color:colorOf(p.c)}));
}

function yearChart(y){
  const data = []; for (let m=1;m<=12;m++){ data.push(totals(monthItems(y+"-"+pad(m)))); }
  const max = Math.max(1, ...data.map(d=>Math.max(d.i,d.e)));
  const step = niceStep(max/3); const top = Math.ceil(max/step)*step;
  const W=340,H=170,L=34,Rr=4,T=8,Bt=20; const iw=W-L-Rr, ih=H-T-Bt; const gw=iw/12; const bw=Math.min(9,gw*0.32);
  let s = "";
  for (let v=0; v<=top+1; v+=step){ const yy = T+ih - v/top*ih; s += `<line class="g" x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}"/><text class="lb" x="${L-5}" y="${yy+3}" text-anchor="end">${short(v)}</text>`; }
  data.forEach((d,k)=>{ const cx = L+gw*k+gw/2; const hi = d.i/top*ih, he = d.e/top*ih;
    if (hi>0) s += `<rect class="bi" x="${cx-bw-1}" y="${T+ih-hi}" width="${bw}" height="${hi}" rx="2"><title>Tháng ${k+1}: thu ${fmt(d.i)}</title></rect>`;
    if (he>0) s += `<rect class="be" x="${cx+1}" y="${T+ih-he}" width="${bw}" height="${he}" rx="2"><title>Tháng ${k+1}: chi ${fmt(d.e)}</title></rect>`;
    s += `<text class="lb" x="${cx}" y="${H-5}" text-anchor="middle">${k+1}</text>`; });
  return `<div class="card"><div class="dayhead"><h2>Từng tháng</h2><span class="keyline"><span><i class="dot" style="background:var(--inc)"></i>Thu</span><span><i class="dot" style="background:var(--exp)"></i>Chi</span></span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu chi từng tháng năm ${y}">${s}</svg></div>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x||1))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

/* ---------- CSV ---------- */
function toCSV(){
  const q = v => /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  const rows = [["Ngày","Loại","Danh mục","Số tiền","Ghi chú"]];
  Object.keys(S.months).sort().forEach(ym => [...S.months[ym]].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).forEach(x => rows.push([x.d, x.t==="i"?"Thu":"Chi", catById(x.c).name, String(x.a), x.n||""])));
  return rows.map(r=>r.map(c=>q(String(c))).join(",")).join("\r\n");
}
function parseCSV(text){
  const rows=[]; let r=[], f="", q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if (ch==='"') q=true; else if (ch===','||ch===';'){ r.push(f); f=""; } else if (ch==='\n'){ r.push(f); rows.push(r); r=[]; f=""; } else if (ch!=='\r') f+=ch; }
  if (f||r.length){ r.push(f); rows.push(r); } return rows;
}
/* ---------- MoneyNote ("Sổ thu chi" của Komorebi) export ---------- */
const MN_ICONS = {"ăn uống":"🍜","chi tiêu hàng ngày":"🛒","quần áo":"👕","mỹ phẩm":"💄","phí giao lưu":"🍻","y tế":"💊","giáo dục":"📚","tiền điện":"💡","đi lại":"🛵","phí liên lạc":"📱","tiền nhà":"🏠","mua sắm":"🛍️","tiền lương":"💼","tiền phụ cấp":"🧾","tiền thưởng":"🏆","thu nhập phụ":"💻","đầu tư":"📈","thu nhập tạm thời":"🧧","khác":"📦"};
function mnSections(text){
  const out = {}; let cur = null;
  for (const line of text.split(/\r?\n/)){
    if (line.startsWith("#")){ cur = line.slice(1).trim(); out[cur] = []; continue; }
    if (cur && line.trim()) out[cur].push(line);
  }
  const objs = {};
  for (const k in out){ const rows = parseCSV(out[k].join("\n")); const h = (rows[0]||[]).map(s=>s.trim());
    objs[k] = rows.slice(1).map(r => Object.fromEntries(h.map((name,i)=>[name,(r[i]??"").trim()]))); }
  return objs;
}
function importMoneyNote(text){
  const sec = mnSections(text);
  const daily = sec.DAILY_DATAS || [], cats = sec.CATEGORIES || [], buds = sec.BUDGET_SETTINGS || [], books = sec.ACCOUNT_BOOKINGS || [], fixed = sec.FIXED_COST_SETTINGS || [];
  const hadData = !sample && Object.values(S.months).some(a => a.length);
  leaveSample();
  const fresh = !hadData;                    // empty notebook: take MoneyNote's categories as they are
  if (fresh){ S.settings.exp = []; S.settings.inc = []; }
  const map = {}; let newCats = 0;
  [...cats].sort((a,b)=>Number(a.index)-Number(b.index)).forEach(c => {
    if (!c.name) return;
    const t = c.type === "1" ? "i" : "e"; const list = catsOf(t);
    let mine = list.find(x => x.name.toLowerCase() === c.name.toLowerCase());
    if (!mine){ mine = {id:"mn"+c.id, ic:MN_ICONS[c.name.toLowerCase()]||"•", name:c.name, col:list.length%COLORS.length, ...(/^[0-9a-f]{6}$/i.test(c.color)?{hex:"#"+c.color}:{})}; list.push(mine); newCats++; }
    if (mine.hidden) delete mine.hidden;
    map[c.id] = mine.id;
  });
  const fallback = t => { const list = catsOf(t); let k = list.find(x=>x.name==="Khác"); if (!k){ k = {id:"c"+uid(), ic:"📦", name:"Khác", col:list.length%COLORS.length}; list.push(k); } return k.id; };
  const seen = new Set(Object.values(S.months).flat().map(x=>x.id));
  const touched = new Set(); let n = 0, skipped = 0;
  for (const r of daily){
    const m = (r.inputDateString||"").match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/); const a = Math.round(Number(r.amount));
    if (!m || !(a > 0)) continue;
    const d = m[1]+"-"+pad(m[2])+"-"+pad(m[3]); const t = r.type === "1" ? "i" : "e";
    const id = "mn-" + (r.createdAt || (d+"-"+a+"-"+r.memo)).replace(/[^0-9A-Za-z]/g,"");
    if (seen.has(id)){ skipped++; continue; } seen.add(id);
    (S.months[ymOf(d)] ||= []).push({id, t, c: map[r.categoryId] || fallback(t), a, d, n: r.memo || ""});
    touched.add(ymOf(d)); n++;
  }
  // budgets: newest setting per category; "-1" means none, category 0 is MoneyNote's overall total
  const latest = {};
  for (const b of buds){ if (!latest[b.tempCategoryId] || b.time > latest[b.tempCategoryId].time) latest[b.tempCategoryId] = b; }
  let nb = 0;
  for (const k in latest){ const amt = Number(latest[k].amount); const id = map[k];
    if (k !== "0" && id && amt > 0 && (fresh || !S.settings.budgets[id])){ S.settings.budgets[id] = amt; nb++; } }
  const tot = latest["0"] ? Number(latest["0"].amount) : 0;
  if (tot > 0 && !(Number(S.settings.budgets[OTHER]) > 0)){
    const sumCats = Object.entries(S.settings.budgets).filter(([k])=>k!==OTHER).reduce((s,[,v])=>s+Number(v),0);
    if (tot > sumCats){ S.settings.budgets[OTHER] = tot - sumCats; ensureOtherCat(); nb++; }
  }
  const bal = Number((books[0]||{}).initialBalance); if (fresh && bal > 0) S.settings.opening = bal;
  saveSettings(); touched.forEach(saveMonth);
  const last = [...touched].sort().pop(); if (last){ ui.calYm = last; ui.calSel = last+"-01"; ui.repYm = last; }
  toast(`Đã nhập ${n} khoản` + (skipped ? `, bỏ qua ${skipped} khoản đã có` : "") + (nb ? `, ${nb} ngân sách` : "") + (fixed.length ? ". Khoản cố định cần tạo lại thủ công." : ""));
  tab = "cal"; render(); window.scrollTo(0,0);
}

function importCSV(text){
  if (/#DAILY_DATAS/.test(text) || /inputDateString/.test(text)) return importMoneyNote(text.replace(/^\uFEFF/,""));
  const rows = parseCSV(text.replace(/^﻿/,"")).filter(r=>r.some(c=>c.trim())); if (rows.length<2){ toast("File không có dòng dữ liệu nào."); return; }
  const h = rows[0].map(s=>s.trim().toLowerCase());
  const col = names => h.findIndex(x=>names.includes(x));
  const iD=col(["ngày","date"]), iT=col(["loại","type"]), iC=col(["danh mục","category"]), iA=col(["số tiền","amount"]), iN=col(["ghi chú","note","memo"]);
  if (iD<0||iA<0){ toast("Không nhận ra cột Ngày và Số tiền trong file."); return; }
  leaveSample();
  let n=0; const touched=new Set(); let catsChanged=false;
  for (const r of rows.slice(1)){
    let d=(r[iD]||"").trim(); const m1=d.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if (m1) d=m1[3]+"-"+pad(m1[2])+"-"+pad(m1[1]);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    const a=parseMoney(r[iA]); if (!a) continue;
    const t=/thu|inc/i.test(r[iT]||"")?"i":"e"; const nm=(r[iC]||"Khác").trim()||"Khác";
    const list=catsOf(t); let c=list.find(x=>x.name.toLowerCase()===nm.toLowerCase());
    if (!c){ c={id:"c"+uid(), ic:"•", name:nm, col:list.length%COLORS.length}; list.push(c); catsChanged=true; }
    if (c.hidden){ delete c.hidden; catsChanged=true; }
    (S.months[ymOf(d)] ||= []).push({id:uid(), t, c:c.id, a, d, n:(iN>=0?(r[iN]||""):"").trim()}); touched.add(ymOf(d)); n++;
  }
  if (catsChanged) saveSettings();
  touched.forEach(saveMonth);
  toast(n ? "Đã nhập "+n+" khoản" : "Không có dòng hợp lệ để nhập.");
  render();
}

/* ---------- render & events ---------- */
function render(fromSync){
  if (fromSync && tab==="set" && document.activeElement && document.activeElement.matches("input")) return;
  if (fromSync && tab==="entry"){ const v=$("#view"); const keep=$("#f-note") && document.activeElement===$("#f-note"); v.innerHTML = renderEntry(); updateAmount(); if (keep) $("#f-note").focus(); return; }
  const v = $("#view");
  v.innerHTML = tab==="entry" ? renderEntry() : tab==="cal" ? renderCal() : tab==="rep" ? renderRep() : renderSet();
  if (tab==="entry") updateAmount();
  document.querySelectorAll("#tabs button").forEach(b => { if (b.dataset.tab===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.body.classList.toggle("locked", tab==="entry"); fitDock();
}
function fitDock(){ const tb = document.querySelector(".tabbar"); if (tb) document.documentElement.style.setProperty("--dockb", tb.offsetHeight + "px"); }
window.addEventListener("resize", fitDock);

$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; ui.wipeArm=false; ui.delArm=false; ui.recurArm=null; render(); window.scrollTo(0,0);
  const v = $("#view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); clearTimeout(v._t); v._t = setTimeout(()=>v.classList.remove("enter"), 700); });

let lastKeyDown = 0;
$("#view").addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const b = e.target.closest('[data-act="key"]'); if (!b) return;
  e.preventDefault();                       // keep focus and selection where they are
  lastKeyDown = Date.now();
  pressKey(b.dataset.v);
  if (navigator.vibrate) { try { navigator.vibrate(6); } catch(_){} }
  b.classList.add("down"); setTimeout(() => b.classList.remove("down"), 120);
});
$("#view").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const act = b.dataset.act, v = b.dataset.v;
  if (act === "key" && Date.now() - lastKeyDown < 800) return;   // already handled on touch-down
  switch(act){
    case "clearSample": leaveSample(); toast("Sổ trống đã sẵn sàng"); render(); break;
    case "type": if (ui.type!==v){ ui.type=v; ui.cat=null; render(); } break;
    case "day": { const d=parseD(ui.date); d.setDate(d.getDate()+Number(v)); ui.date=ymd(d); render(); break; }
    case "cat": ui.cat=v; document.querySelectorAll(".cat").forEach(c=>c.setAttribute("aria-pressed", c.dataset.v===v)); updateAmount(); break;
    case "key": pressKey(v); break;
    case "submit": submitEntry(); break;
    case "rep": ui.rep = v; render(); break;
    case "repCycle": ui.rep = ui.rep==="" ? "m" : ui.rep==="m" ? "w" : ""; render(); if (ui.rep) toast(ui.rep==="m" ? "Khoản này sẽ tự ghi vào ngày " + parseD(ui.date).getDate() + " mỗi tháng" : "Khoản này sẽ tự ghi vào " + WDS[parseD(ui.date).getDay()].toLowerCase() + " mỗi tuần"); break;
    case "recurNew": Object.assign(ui,{rep:"m", date:TODAY, editId:null, editYm:null, expr:"", note:"", delArm:false}); tab="entry"; render(); window.scrollTo(0,0); break;
    case "recurDel":
      if (ui.recurArm !== v){ ui.recurArm = v; render(); break; }
      { leaveSample(); const L = recurs(); const i = L.findIndex(r=>r.id===v); if (i>=0){ L.splice(i,1); saveSettings(); }
        ui.recurArm = null; toast("Đã dừng khoản cố định"); render(); }
      break;
    case "cancelEdit": Object.assign(ui,{editId:null,editYm:null,expr:"",note:"",delArm:false,date:TODAY}); tab="cal"; render(); break;
    case "del":
      if (!ui.delArm){ ui.delArm=true; render(); break; }
      { const arr=S.months[ui.editYm]||[]; const i=arr.findIndex(x=>x.id===ui.editId);
        if (i>=0){ if (sample){ arr.splice(i,1); } else { arr.splice(i,1); saveMonth(ui.editYm); } }
        Object.assign(ui,{editId:null,editYm:null,expr:"",note:"",delArm:false}); tab="cal"; toast("Đã xóa khoản"); render(); }
      break;
    case "calM": ui.calYm=addMonths(ui.calYm,Number(v)); ui.calSel = ui.calYm===ymOf(TODAY)?TODAY:ui.calYm+"-01"; render(); break;
    case "calToday": ui.calYm=ymOf(TODAY); ui.calSel=TODAY; render(); break;
    case "sel": ui.calSel=v; render(); break;
    case "addOn": Object.assign(ui,{date:v,editId:null,editYm:null,expr:"",note:"",delArm:false}); tab="entry"; render(); window.scrollTo(0,0); break;
    case "edit": startEdit(b.dataset.ym, v); window.scrollTo(0,0); break;
    case "repMode": ui.repMode=v; render(); break;
    case "repType": ui.repType=v; render(); break;
    case "repP": if (ui.repMode==="m") ui.repYm=addMonths(ui.repYm,Number(v)); else ui.repY+=Number(v); render(); break;
    case "setCat": ui.setCatType=v; render(); break;
    case "catAdd": { const nm=$("#new-nm").value.trim(); if (!nm){ $("#new-nm").focus(); break; }
      leaveSample(); const list=catsOf(ui.setCatType);
      list.push({id:"c"+uid(), ic:$("#new-ic").value.trim()||"•", name:nm, col:list.length%COLORS.length}); saveSettings(); toast("Đã thêm danh mục "+nm); render(); break; }
    case "catDel": { leaveSample(); const list=catsOf(ui.setCatType); const i=list.findIndex(c=>c.id===v); if (i<0) break;
      const used = Object.values(S.months).some(a=>a.some(x=>x.c===v));
      if (used) list[i].hidden=true; else list.splice(i,1);
      if (ui.setCatType==="e") delete S.settings.budgets[v];
      saveSettings(); toast(used?"Đã ẩn danh mục. Các khoản cũ vẫn giữ nguyên.":"Đã xóa danh mục"); render(); break; }
    case "csvSave": { const name="so-thu-chi-"+TODAY+".csv";
      try { const blob = new Blob(["\uFEFF"+toCSV()], {type:"text/csv;charset=utf-8"}); const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
        toast("Đã tải "+name); }
      catch(err){ ui.csvText=toCSV(); render(); toast("Không tải được file. Bạn có thể sao chép nội dung CSV bên dưới."); }
      break; }
    case "csvCopy": { const txt=toCSV(); ui.csvText=txt;
      try { await navigator.clipboard.writeText(txt); toast("Đã sao chép CSV"); render(); }
      catch(err){ render(); const box=$("#csvBox"); if (box){ box.focus(); box.select(); } toast("Hãy chọn và sao chép nội dung bên dưới"); }
      break; }
    case "wipe":
      if (!ui.wipeArm){ ui.wipeArm=true; render(); break; }
      { const was = sample; leaveSample(); if (!was){ const keys=Object.keys(S.months); S.months={}; keys.forEach(saveMonth); } ui.wipeArm=false; toast("Đã xóa toàn bộ khoản thu chi"); render(); }
      break;
  }
});

$("#view").addEventListener("input", e => {
  const t = e.target;
  if (t.id==="f-note") ui.note = t.value;
  if (t.classList.contains("money")){ const pos = t.value.length - t.selectionStart; const n=parseMoney(t.value); t.value = n?NF.format(n):""; try{ const p=Math.max(0,t.value.length-pos); t.setSelectionRange(p,p);}catch(_){} }
});
$("#view").addEventListener("change", e => {
  const t = e.target;
  if (t.id==="f-date" && t.value){ ui.date=t.value; render(); return; }
  if (t.dataset.budget){ const was=leaveSample(); const n=parseMoney(t.value); if (n) S.settings.budgets[t.dataset.budget]=n; else delete S.settings.budgets[t.dataset.budget];
    let added = false; if (t.dataset.budget===OTHER && n) added = ensureOtherCat();
    saveSettings(); if (was || added) render(); else { const bt=$("#btotal"); if (bt) bt.textContent = fmt(budgetPlan([]).totalB); }
    if (added) toast("Đã thêm mục Khác để chọn khi ghi sổ"); return; }
  if (t.id==="opening"){ const was=leaveSample(); S.settings.opening=parseMoney(t.value); saveSettings(); if (was) render(); return; }
  if (t.dataset.catnm || t.dataset.catic){ const id=t.dataset.catnm||t.dataset.catic; const was=leaveSample(); const c=catsOf(ui.setCatType).find(x=>x.id===id);
    if (c){ if (t.dataset.catnm){ const nm=t.value.trim(); if (nm) c.name=nm; else t.value=c.name; } else { c.ic=t.value.trim()||"•"; } saveSettings(); } if (was) render(); return; }
  if (t.id==="csvIn" && t.files && t.files[0]){ const fr=new FileReader(); fr.onload=()=>importCSV(String(fr.result)); fr.onerror=()=>toast("Không đọc được file."); fr.readAsText(t.files[0]); t.value=""; }
});
document.addEventListener("keydown", e => {
  if (tab!=="entry" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches("input,textarea,select")){ if (e.key==="Enter" && e.target.id==="f-note"){ e.preventDefault(); submitEntry(); } return; }
  const k = e.key;
  if (/^[0-9]$/.test(k)) pressKey(k); else if (k==="Backspace") pressKey("back"); else if (k==="+"||k==="-") pressKey(k);
  else if (k==="Escape") pressKey("C"); else if (k==="Enter"){ e.preventDefault(); submitEntry(); } else return;
});

{ if (!sample && migrateOther()) saveSettings(); const added = runRecurring(); render(); if (added) toast("Đã tự ghi " + added + " khoản cố định"); }
initDevice();
})();
</script>
